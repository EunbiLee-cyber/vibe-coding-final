<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- open box lo-fi -->
  <!-- box body -->
  <rect x="20" y="70" width="120" height="80" rx="4" fill="#D4A96A" stroke="#000" stroke-width="3"/>
  <!-- box front line -->
  <line x1="20" y1="100" x2="140" y2="100" stroke="#000" stroke-width="2"/>
  <!-- left flap (open) -->
  <polygon points="20,70 80,70 80,30 20,50" fill="#C4994A" stroke="#000" stroke-width="2.5"/>
  <!-- right flap (open) -->
  <polygon points="140,70 80,70 80,30 140,50" fill="#C4994A" stroke="#000" stroke-width="2.5"/>
  <!-- inside shadow -->
  <rect x="25" y="72" width="110" height="25" fill="#A07840" opacity="0.3"/>
  <!-- label -->
  <rect x="45" y="108" width="70" height="28" rx="3" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="80" y="127" font-family="monospace" font-size="11" fill="#000" text-anchor="middle">open</text>
</svg>
